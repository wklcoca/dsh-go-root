name: build-apk

# 在 GitHub Actions（x86_64 免费 runner）上构建 arm64 APK。
# 流程：克隆 upstream 指定 tag → 应用本仓库 patches/ → 复用官方 APK 的 runtime → flutter build。
# 不依赖 runtime/build-runtime.sh（那需要 x86_64 交叉构建，耗时数小时）。

on:
  workflow_dispatch:
    inputs:
      upstream:
        description: "upstream tag（如 v1.0.13）"
        type: string
        default: v1.0.13
      flavor:
        description: "ABI flavor"
        type: choice
        default: arm64
        options: [arm64, x64]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Apply patches onto upstream
        env:
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          chmod +x scripts/*.sh
          OUT=work ./scripts/apply.sh
          echo "--- patched tree ---"
          git -C work log --oneline -5

      # settings.gradle.kts 在配置阶段就会读 local.properties 的 flutter.sdk，必须先建
      - name: Write local.properties (needed by settings.gradle.kts)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$SDK" "$FLUTTER_ROOT" > work/app/android/local.properties
          cat work/app/android/local.properties

      # app/android/.gitignore 忽略了 gradlew / gradle-wrapper.jar，必须先生成
      - name: Generate Gradle wrapper
        working-directory: work/app/android
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type all

      - name: Install Android SDK bits + Flutter's NDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-36" "platforms;android-35" "platforms;android-34" \
                  "build-tools;36.0.0" "build-tools;35.0.0" >/dev/null
          NDK=$(grep -rhoE 'ndkVersion[[:space:]]*[:=][[:space:]]*"[0-9][0-9.]+"' "$FLUTTER_ROOT/packages/flutter_tools/gradle" 2>/dev/null | grep -oE '[0-9][0-9.]+' | head -1)
          echo "flutter ndkVersion = ${NDK:-<none>}"
          if [ -n "$NDK" ] && [ ! -d "$SDK/ndk/$NDK" ]; then "$SDKM" "ndk;$NDK" || true; fi

      - name: Reuse official runtime (skip runtime/build-runtime.sh)
        env:
          UPSTREAM: ${{ inputs.upstream }}
          ABI: ${{ inputs.flavor }}
        run: |
          set -e
          URL="https://github.com/ccch1mneyyy/dsh-Go/releases/download/${UPSTREAM}/dsh-go-${UPSTREAM#v}-${ABI}.apk"
          curl -fL --retry 3 --max-time 900 -o /tmp/official.apk "$URL" \
            || curl -fL --retry 3 --max-time 900 -o /tmp/official.apk "https://ghfast.top/$URL"
          mkdir -p /tmp/official && (cd /tmp/official && unzip -q /tmp/official.apk)
          OUT="work/runtime/out/${ABI}"
          mkdir -p "$OUT/assets/runtime" "$OUT/jniLibs/${ABI}"
          cp -a /tmp/official/assets/runtime/. "$OUT/assets/runtime/"
          for so in libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so; do
            [ -e "/tmp/official/lib/${ABI}/$so" ] && cp -a "/tmp/official/lib/${ABI}/$so" "$OUT/jniLibs/${ABI}/$so"
          done
          ls "$OUT/jniLibs/${ABI}" | head

      - name: flutter pub get
        working-directory: work/app
        run: flutter pub get

      # 仓库里的合并 ARB/gen 可能落后于 parts，用 runner 的 Flutter 重新生成
      - name: Generate l10n from parts
        run: cd work && python3 app/tool/l10n_merge.py

      # 固定签名：从 Secrets 解码 keystore，指向 key.properties，
      # 使每次自建 APK 签名一致，可覆盖升级（无需卸载）。
      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.DSH_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DSH_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DSH_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DSH_KEY_ALIAS }}
        run: |
          mkdir -p work/app/android/keys
          printf '%s' "$KEYSTORE_B64" | base64 -d > work/app/android/keys/dsh-release.jks || true
          if [ -s work/app/android/keys/dsh-release.jks ]; then
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$GITHUB_WORKSPACE/work/app/android/keys/dsh-release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > work/app/android/key.properties
            echo "using fixed release keystore"
          else
            echo "no keystore secret; falling back to debug key"
          fi

      - name: Build APK
        env:
          ABI: ${{ inputs.flavor }}
        run: |
          cd work
          chmod +x tooling/build-apk.sh
          tooling/build-apk.sh --release -f "$ABI"

      - name: Collect APK
        run: |
          mkdir -p out
          find work/app/build -name "*.apk" -path "*release*" -exec cp {} out/ \; || true
          if [ -z "$(ls -A out)" ]; then
            find work/app/build -name "*.apk" -exec cp {} out/ \;
          fi
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      # 直接在本仓库发 Release（不需要把 APK 下到本地）
      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: ${{ inputs.upstream }}
          ABI: ${{ inputs.flavor }}
        run: |
          set -e
          TAG="${UPSTREAM}-root.${{ github.run_number }}"
          SHA=$(sha256sum out/*.apk | awk '{print $1}')
          SIZE=$(stat -c%s out/*.apk)
          NAME=$(basename "$(ls out/*.apk | head -1)")
          cat > /tmp/notes.md <<EOF
          ## dsh-go ${UPSTREAM#v} + root 增强

          基于 upstream \`${UPSTREAM}\`，应用 \`patches/\` 补丁构建（${ABI}）。

          ### 包含
          - **root 模式**：proot 以真 uid 0 运行（KernelSU / Magisk）
          - **多分区挂载**：\`/data\`、\`/product\`、\`/vendor\`、\`/my_*\` 直接可见
          - **root-exec 通道**（\`dsh-root\`）：在 proot 外以真 root 执行命令，\`TracerPid: 0\`，可用于 frida-server
          - **rootfs 属主自愈**：修复 root 模式后"解压时出错"、崩溃后起不来

          ### 安装
          - 包名 \`io.github.ccch1mneyyy.dsh_app.dev\`，与官方版并存
          - 固定签名，可覆盖升级（无需卸载）

          ### 校验
          \`\`\`
          sha256  ${SHA}
          size    ${SIZE}
          \`\`\`

          ### 启用 root
          设置 → 诊断 → 开发者选项 → root 模式 → 重启引擎 → 允许 su 授权。

          详见 [README](https://github.com/wklcoca/dsh-go-root#readme)。
          EOF
          sed -i 's/^          //' /tmp/notes.md
          cp out/*.apk "out/dsh-go-${UPSTREAM#v}-root-${ABI}.apk"
          gh release create "$TAG" "out/dsh-go-${UPSTREAM#v}-root-${ABI}.apk" \
            --title "dsh-go ${UPSTREAM#v} + root 增强" \
            --notes-file /tmp/notes.md \
            --prerelease \
            --target "${{ github.sha }}"
          echo "released $TAG ($NAME, $SIZE bytes)"
